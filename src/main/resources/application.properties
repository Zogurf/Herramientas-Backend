# Server Configuration
server.port=${PORT:8080}
server.servlet.context-path=/api

# Carga del archivo .env local.
# spring-dotenv no funciona con Spring Boot 4 (se registra en spring.factories,
# que Boot 4 ya no lee para SpringApplicationRunListener), así que el .env se
# importa como properties: mismo formato KEY=VALUE y sin dependencias.
# `optional:` permite arrancar en Render, donde el archivo no existe; las
# variables de entorno del sistema siguen teniendo prioridad sobre este import.
spring.config.import=optional:file:./.env[.properties]

# Insforge Cloud PostgreSQL Database Connection
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:none}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart / File Upload Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Cloudinary Storage Configuration
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# JWT Security Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Gmail SMTP Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

# Frontend URL (para enlaces de recuperación)
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# CORS: orígenes permitidos, lista separada por comas (admite patrones,
# por ejemplo https://*.onrender.com para los previews de Render).
# En despliegue se define con la variable CORS_ALLOWED_ORIGINS.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000}

# Google OAuth2 (verificación del ID token en /v1/auth/google)
google.client-id=${GOOGLE_CLIENT_ID:}

# Facebook Login (verificación del access token en /v1/auth/facebook).
# "Client ID" / "Client Secret" son el App ID y el App Secret de Meta; se
# mantiene ese nombre por coherencia con las credenciales de Google.
# El Client Secret es imprescindible: debug_token se autentica con id|secret
# para comprobar que el token pertenece a esta aplicación.
facebook.client-id=${FACEBOOK_CLIENT_ID:}
facebook.client-secret=${FACEBOOK_CLIENT_SECRET:}
facebook.api-version=${FACEBOOK_API_VERSION:v26.0}

# =============================================================================
# Observabilidad (Spring Boot Actuator + Micrometer)
# Ojo: server.servlet.context-path=/api, así que las rutas externas son
# /api/actuator/health y /api/actuator/prometheus.
# =============================================================================

# Endpoints expuestos. El resto queda deshabilitado por defecto.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
# Los detalles del health solo se muestran a quien tenga el rol MONITOR.
management.endpoint.health.show-details=when_authorized
management.endpoint.health.roles=MONITOR

# Etiqueta global para distinguir entornos en los dashboards.
management.metrics.tags.application=nexora-backend
# Histograma de latencias HTTP: habilita p95/p99 agregables desde los _bucket.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Usuario de HTTP Basic para /api/actuator/prometheus y el resto de endpoints
# protegidos. Si falta cualquiera de las dos variables, esa cadena falla cerrada
# (401) y nunca usa credenciales por defecto.
monitoring.user=${MANAGEMENT_USER:}
monitoring.password=${MANAGEMENT_PASSWORD:}

# --- Push OTLP a Grafana Cloud (producción) --------------------------------
# Desactivado por defecto: en local se usa el scrape de Prometheus.
management.otlp.metrics.export.enabled=${OTLP_ENABLED:false}
management.otlp.metrics.export.url=${OTLP_URL:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=60s
# Grafana Cloud espera "Basic <base64(instanceID:token)>".
management.otlp.metrics.export.headers.Authorization=${OTLP_AUTH:}
