# Carga automática de los dashboards JSON montados en /var/lib/grafana/dashboards.
apiVersion: 1

providers:
  - name: nexora
    orgId: 1
    folder: NEXORA
    folderUid: nexora
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
