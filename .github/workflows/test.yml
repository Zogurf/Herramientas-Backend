name: Backend CI

on:
  push:
    branches: [dev]

  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  test:
    name: Spring Boot Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify
