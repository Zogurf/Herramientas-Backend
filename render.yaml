# =============================================================================
# Render Blueprint — NEXORA STORAGE & LOGISTICS · BACKEND
# Servicio web Docker (Spring Boot 4 · Java 21 · contexto HTTP /api)
#
# Cómo desplegar:  Render Dashboard → New + → Blueprint → elegir este repo y la
#                  rama `dev`. Render leerá este archivo y creará el servicio.
#
# Las variables marcadas con `sync: false` NO se guardan en el repositorio:
# el dashboard pedirá su valor al crear el servicio. No pongas secretos aquí.
# =============================================================================

services:
  - type: web
    name: nexora-backend
    runtime: docker
    plan: free # 0.1 CPU / 512 MB. Si hay errores OOM, subir a `0.5c-512mb` o `1c-2g`.
    region: virginia # US East: la región más cercana a la base InsForge (us-east).
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: commit # Redeploy automático con cada push a `dev`.

    # Sonda de Render: usa el grupo de liveness de Actuator, no el estado global.
    # /health devuelve 503 si la base de datos no responde, y Render reiniciaría
    # el servicio en bucle por un fallo ajeno. /health/liveness solo comprueba
    # que el proceso está vivo.
    healthCheckPath: /api/actuator/health/liveness

    envVars:
      # ---------------------------------------------------------------------
      # Base de datos — PostgreSQL administrado por InsForge
      # ---------------------------------------------------------------------
      # Formato: jdbc:postgresql://<host>:5432/insforge?sslmode=require
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # `none` es obligatorio en producción: el esquema manda (src/main/resources/schema.sql).
      # Con `update`, Hibernate alteraría auth_schema y store_schema en cada arranque.
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: none

      # ---------------------------------------------------------------------
      # Seguridad · JWT
      # ---------------------------------------------------------------------
      # Render genera un valor aleatorio base64 de 256 bits (44 caracteres).
      # JwtTokenProvider usa los bytes UTF-8 del secreto, así que sirve tal cual.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: 86400000 # 24 h en milisegundos

      # ---------------------------------------------------------------------
      # Cloudinary — avatares de perfil e imágenes de producto
      # ---------------------------------------------------------------------
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # ---------------------------------------------------------------------
      # Google OAuth — verificación del id_token en POST /api/v1/auth/google
      # ---------------------------------------------------------------------
      # Es el "Client ID" (público). El frontend usa el mismo valor.
      - key: GOOGLE_CLIENT_ID
        sync: false

      # ---------------------------------------------------------------------
      # Facebook Login — verificación del access token en POST /api/v1/auth/facebook
      # ---------------------------------------------------------------------
      # ⚠️ Son OBLIGATORIAS para que ese endpoint funcione: sin ellas responde
      #    400 con "no está configurado en el servidor". El Client Secret (App
      #    Secret de Meta) NO se comparte con el frontend: vive solo aquí.
      # El Client ID (público) también se necesita en el frontend como
      # NEXT_PUBLIC_FACEBOOK_CLIENT_ID, con el MISMO valor.
      - key: FACEBOOK_CLIENT_ID
        sync: false
      - key: FACEBOOK_CLIENT_SECRET
        sync: false
      # Versión de la Graph API usada por backend y frontend.
      - key: FACEBOOK_API_VERSION
        value: v26.0

      # ---------------------------------------------------------------------
      # SMTP de Gmail — recuperación de contraseña
      # ---------------------------------------------------------------------
      # ⚠️ El plan Free de Render bloquea los puertos de salida 25, 465 y 587,
      #    y Gmail usa el 587: el correo NO se enviará. Además EmailService
      #    absorbe el fallo, así que el endpoint igualmente responde 200 y
      #    parecería que funcionó. Solución: proveedor por API HTTP
      #    (Resend, Brevo, SendGrid) o subir a un plan con puertos abiertos.
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

      # ---------------------------------------------------------------------
      # URL pública del frontend — enlaces de recuperación de contraseña
      # ---------------------------------------------------------------------
      # Ej.: https://nexora-frontend.onrender.com  (SIN barra final)
      - key: FRONTEND_URL
        sync: false

      # ---------------------------------------------------------------------
      # CORS
      # ---------------------------------------------------------------------
      # Orígenes permitidos por el navegador. Los lee CorsConfig desde
      # `app.cors.allowed-origins`; admite patrones con comodín.
      # Valor: URL del frontend, sin barra final.
      # Ej.: https://nexora-frontend.onrender.com  o  https://*.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # ---------------------------------------------------------------------
      # Observabilidad · Actuator (HTTP Basic) y push OTLP a Grafana Cloud
      # ---------------------------------------------------------------------
      # /api/actuator/health (y /health/liveness) es público; el resto de
      # endpoints, incluido /api/actuator/prometheus, exige estas credenciales
      # con rol MONITOR. Si faltan, Actuator responde 401 (falla cerrado).
      # Usa una contraseña fuerte y DISTINTA de la local.
      - key: MANAGEMENT_USER
        sync: false
      - key: MANAGEMENT_PASSWORD
        sync: false

      # Push de métricas a Grafana Cloud (no hay Prometheus en Render).
      - key: OTLP_ENABLED
        value: "true"
      # Endpoint OTLP de tu stack: https://otlp-gateway-<region>.grafana.net/otlp/v1/metrics
      - key: OTLP_URL
        sync: false
      # Cabecera Authorization completa: "Basic <base64(instanceID:token)>"
      - key: OTLP_AUTH
        sync: false
